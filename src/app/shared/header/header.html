
<header class="header">
  <div class="header-container">
    <div class="header-left">
      <a routerLink="/" class="logo">Foodie</a>

      <nav>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Home
        </a>

        <a routerLink="/menu" routerLinkActive="active">
          Menu
        </a>
      </nav>
    </div>

    <div class="header-actions">
      <a routerLink="/cart" class="cart" aria-label="Cart">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path
            d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
          ></path>
        </svg>

        @if (isLoggedIn() && cartService.totalItems() > 0) {
          <span class="cart-badge">
            {{ cartService.totalItems() }}
          </span>
        }
      </a>

      @if (isLoggedIn()) {
        <div class="profile-wrapper">
          <button
            type="button"
            class="profile"
            aria-label="Profile menu"
            [attr.aria-expanded]="showDropdown()"
            (click)="toggleDropdown()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"
              ></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>

          @if (showDropdown()) {
            <div class="profile-dropdown">
              @if (firstName()) {
                <div class="dropdown-greeting">
                  Hello: {{ firstName() }}
                </div>
              }

              <a routerLink="/profile">Profile</a>

              <button type="button" (click)="logout()">
                Logout
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" class="login">
          Login
        </a>

        <a routerLink="/register" class="signup">
          Sign Up
        </a>
      }
    </div>
  </div>
</header>
